<!DOCTYPE html>
<html>
<head>
    <title>Register - Get Over It</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body>
    <header>
        <h1>Register to Get Over It</h1>
    </header>
    <main>
        <form action="/register" method="post" class="registration-form">
            <label for="username">Dummy Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" minlength="8" pattern="[A-Za-z0-9]{8,}" title="Password must be at least 8 alphanumeric characters" required>

            <button type="submit">Register</button>
        </form>
    </main>
    <footer>
        <p>GOI@2025</p>
    </footer>
</body>
</html>
